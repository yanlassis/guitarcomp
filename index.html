<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuitarComp</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>GuitarComp</h1>
        <p>Make learning a new instrument easier.</p>
      </header>

      <section>
        <h2>Practice with a YouTube tutorial</h2>
        <form id="youtube-form">
          <label for="youtube-url">Paste the video URL:</label>
          <input
            id="youtube-url"
            type="url"
            placeholder="https://www.youtube.com/watch?v=..."
            aria-describedby="youtube-help youtube-message"
          >
          <button id="youtube-submit" type="submit" disabled>Load</button>
        </form>
        <p id="youtube-help" class="privacy-note">
          Supports youtube.com/watch and youtu.be video links.
        </p>
        <p id="youtube-message" role="status"></p>
      </section>

      <section>
        <h2>Upload the song you would like to learn</h2>
          <label for="audio-file">Choose an audio file</label>
            <input id="audio-file" type="file" accept="audio/*" aria-describedby="audio-privacy audio-message">
            <p id="audio-privacy" class="privacy-note">Your audio stays on this device and is not uploaded.</p>
            <p id="audio-message" role="alert"></p>
          <audio hidden id="audio-player" controls></audio>
      </section>

      <section> 
        <h2>Playback</h2>
        <button id="play-button" type="button" disabled>Play</button>
        <span id="time-display">0:00 / 0:00</span>
        <label for="progress">Progress</label>
        <input id="progress" type="range" min="0" max="100" value="0" disabled>
        <label for="speed">Speed</label>
        <select id="speed" disabled>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1" selected>100%</option>
        </select>
      </section>

      <section>
        <h2>Loop practice</h2>
            <button id="set-a" type="button" disabled>Set A</button>
            <button id="set-b" type="button" disabled>Set B</button>
            <span id="loop-display">A: --:-- | B: --:--</span>
            <p id="loop-message" role="status"></p>
          <label>
            <input id="loop-toggle" type="checkbox" aria-describedby="loop-display loop-message" disabled> Loop A-B
        </label>
          <button id="clear-loop" type="button" disabled>Clear loop</button>
      </section>

    </main>
  </body>
</html>
